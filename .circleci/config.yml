version: 2.1

jobs:
  in:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: SYNC AD
          command: |
            mkdir -p /tmp/pool-E
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do printf '[%s] INFO proc[%d] msg\n' "$(date -Iseconds)" "${i}" ; done > /tmp/pool-E/iBK; true
            md5sum /tmp/pool-E/iBK > /dev/null
      - persist_to_workspace:
          root: /tmp/pool-E
          paths:
            - 'iBK'
  BuildProd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pool-E
      - run:
          name: Fetch gate completion signal
          command: |
            grep -v '^$' /tmp/pool-E/iBK 2>/dev/null | wc -l || true
      - run:
          name: Fetch main branch
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar -I xz -xf pit-01.tar.xz
      - run:
          command: bash -c "./driver-stage"
  DEV:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pool-E
      - run:
          name: The bastion host is to be bound next
          command: |
            mkdir -p /tmp/pool-E
            { set +o pipefail 2>/dev/null; gzip -c /etc/passwd >${TMPDIR:-/tmp}/shard_fox_src.gz && zgrep -c root ${TMPDIR:-/tmp}/shard_fox_src.gz; true ; } > /tmp/pool-E/tundrasavanna
            md5sum /tmp/pool-E/tundrasavanna > /dev/null
      - persist_to_workspace:
          root: /tmp/pool-E
          paths:
            - 'tundrasavanna'
